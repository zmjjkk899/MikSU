name: Build MilkSU

on:
  workflow_dispatch:
    inputs:
      kmi_scope:
        description: KMI coverage
        type: choice
        default: all
        options:
          - android14-6.1
          - all

permissions:
  contents: read

concurrency:
  group: milksu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MILKSU_CACHE: /opt/milksu
      MILKSU_JOBS: 2
      MILKSU_ABIS: 'arm64-v8a x86_64'
      MILKSU_DDK_RELEASE: '20260828'
      MILKSU_SIGNING_PROFILE: development
      MILKSU_REQUIRE_RELEASE_SIGNING: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check build scripts
        shell: bash
        run: |
          for script in tools/build-*.sh tools/bootstrap-*.sh; do
            bash -n "$script"
          done

      - name: Prepare pinned Linux tools
        shell: bash
        run: |
          sudo env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" bash tools/bootstrap-milksu.sh all
          sudo env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" bash tools/bootstrap-kpatch-toolchain.sh

      - name: Validate Rust and build priority ARM64 modules
        shell: bash
        run: |
          sudo --preserve-env=MILKSU_SIGNING_PROFILE,MILKSU_REQUIRE_RELEASE_SIGNING env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" bash tools/build-rust.sh android-check
          sudo --preserve-env=MILKSU_SIGNING_PROFILE,MILKSU_REQUIRE_RELEASE_SIGNING env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" bash tools/build-rust.sh android-clippy
          sudo --preserve-env=MILKSU_SIGNING_PROFILE,MILKSU_REQUIRE_RELEASE_SIGNING env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" bash tools/build-rust.sh format-check
          sudo --preserve-env=MILKSU_SIGNING_PROFILE,MILKSU_REQUIRE_RELEASE_SIGNING env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" bash tools/build-lkm.sh android14-6.1 both

      - name: Build real 5.10 regression assets and run all host tests
        shell: bash
        run: |
          sudo --preserve-env=MILKSU_SIGNING_PROFILE,MILKSU_REQUIRE_RELEASE_SIGNING env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" python3 tools/build-matrix.py --priority-already-passed --kmi android12-5.10 --stage-assets
          sudo --preserve-env=MILKSU_SIGNING_PROFILE,MILKSU_REQUIRE_RELEASE_SIGNING env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" bash tools/build-rust.sh host-tests

      - name: Build remaining KMI modules
        if: inputs.kmi_scope == 'all'
        shell: bash
        run: |
          for kmi in android13-5.10 android13-5.15 android14-5.15 android15-6.6 android16-6.12 android17-6.18; do
            sudo --preserve-env=MILKSU_SIGNING_PROFILE,MILKSU_REQUIRE_RELEASE_SIGNING env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" bash tools/build-lkm.sh "$kmi" both
          done

      - name: Build KPatch, ksuinit, ksud, Manager and signed repack
        shell: bash
        env:
          MILKSU_REQUIRE_FULL_MATRIX: ${{ inputs.kmi_scope == 'all' && '1' || '0' }}
        run: |
          sudo --preserve-env=MILKSU_SIGNING_PROFILE,MILKSU_REQUIRE_RELEASE_SIGNING env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" bash tools/build-kpatch.sh
          sudo --preserve-env=MILKSU_SIGNING_PROFILE,MILKSU_REQUIRE_RELEASE_SIGNING env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" bash tools/build-host.sh
          sudo --preserve-env=MILKSU_SIGNING_PROFILE,MILKSU_REQUIRE_RELEASE_SIGNING env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" bash tools/build-release.sh snapshot --source-ready
          for stage in ksuinit ksud manager repack; do
            sudo --preserve-env=MILKSU_SIGNING_PROFILE,MILKSU_REQUIRE_RELEASE_SIGNING env MILKSU_ROOT="$GITHUB_WORKSPACE" MILKSU_CACHE="$MILKSU_CACHE" MILKSU_ABIS="$MILKSU_ABIS" MILKSU_REQUIRE_FULL_MATRIX="$MILKSU_REQUIRE_FULL_MATRIX" bash tools/build-release.sh "$stage"
          done

      - name: Upload MilkSU build products
        uses: actions/upload-artifact@v7
        with:
          name: MilkSU-universal
          path: |
            out/manager/*.apk
            out/aarch64/*.ko
            out/ksuinit/**
            out/ksud/**
            out/kpatch/**
            out/tools/kptools
            out/tools/ksud
            out/manifests/**
            out/toolchain/**
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MilkSU-build-logs
          path: out/build-logs/
